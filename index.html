    <script id="gemini-aq-compat">
(() => {
  const nativeFetch = window.fetch.bind(window);
  const primaryModelPath = "/models/gemini-2.5-flash:";
  const fallbackModelPath = "/models/gemini-3.5-flash:";

  const responseNeedsFallback = async (response) => {
    if (![400, 401, 403, 404].includes(response.status)) return false;
    let details = "";
    try { details = (await response.clone().text()).toLowerCase(); }
    catch (_) { return response.status === 404; }
    if (details.includes("api key not valid") || details.includes("invalid api key")) return false;
    return response.status === 404 ||
      (details.includes("model") && /(not found|not supported|unavailable|permission|denied|access)/.test(details)) ||
      details.includes("access_token_type_unsupported") ||
      details.includes("api_key_service_blocked");
  };

  window.fetch = async (input, init) => {
    const rawUrl = typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
    let url;
    try { url = new URL(rawUrl, window.location.href); }
    catch (_) { return nativeFetch(input, init); }
    if (url.hostname !== "generativelanguage.googleapis.com") return nativeFetch(input, init);

    const headers = new Headers(input instanceof Request ? input.headers : undefined);
    if (init && init.headers) new Headers(init.headers).forEach((value, name) => headers.set(name, value));
    const queryKey = url.searchParams.get("key") || "";
    if (queryKey && !headers.has("x-goog-api-key")) headers.set("x-goog-api-key", queryKey);
    if (queryKey) url.searchParams.delete("key");
    const apiKey = (headers.get("x-goog-api-key") || queryKey).trim();
    const requestInput = input instanceof Request ? input : url.href;
    const requestInit = { ...(init || {}), headers };
    const requestBackup = input instanceof Request ? input.clone() : null;
    const response = await nativeFetch(requestInput, requestInit);

    if (!/^AQ\./i.test(apiKey) || !url.pathname.includes(primaryModelPath) ||
        !(await responseNeedsFallback(response))) return response;

    const fallbackUrl = url.href.replace(primaryModelPath, fallbackModelPath);
    console.warn("AQ 형식 키의 Gemini 2.5 Flash 접근이 제한되어 Gemini 3.5 Flash로 한 번 재시도합니다.");
    if (!requestBackup) return nativeFetch(fallbackUrl, requestInit);

    const method = requestBackup.method.toUpperCase();
    const retryInit = {
      method, headers, mode: requestBackup.mode, credentials: requestBackup.credentials,
      cache: requestBackup.cache, redirect: requestBackup.redirect,
      referrer: requestBackup.referrer, referrerPolicy: requestBackup.referrerPolicy,
      integrity: requestBackup.integrity, keepalive: requestBackup.keepalive,
      body: method === "GET" || method === "HEAD" ? undefined : await requestBackup.arrayBuffer(),
    };
    return nativeFetch(fallbackUrl, retryInit);
  };

  const updateApiKeyPlaceholder = () => {
    document.querySelectorAll('input[placeholder*="API 키"]').forEach((input) => {
      input.placeholder = "AIza... 또는 AQ.Ab... 로 시작하는 Gemini API 키를 입력하세요";
    });
  };
  document.addEventListener("DOMContentLoaded", updateApiKeyPlaceholder);
  new MutationObserver(updateApiKeyPlaceholder).observe(document.documentElement, { childList: true, subtree: true });
})();
